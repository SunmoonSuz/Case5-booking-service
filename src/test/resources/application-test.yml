spring:
  application:
    name: service-booking-test
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 30
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  timezone: Europe/Moscow
  currency: RUB
  bootstrap-admin:
    email: admin@example.com
    password: admin12345
  demo-seed:
    enabled: false

server:
  port: 8080
  servlet:
    session:
      timeout: 7d
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: service-booking
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      connection-timeout: 20000
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  timezone: ${APP_TIMEZONE:Europe/Moscow}
  currency: ${APP_CURRENCY:RUB}
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:admin12345}
